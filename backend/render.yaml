services:
  - type: web
    name: studywise-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: FRONTEND_ORIGIN
        value: '*'
      - key: DATABASE_URL
        fromDatabase:
          name: studywise-db
          property: connectionString

databases:
  - name: studywise-db
    databaseName: study_assistant
    user: studywise
    plan: free
    region: oregon
