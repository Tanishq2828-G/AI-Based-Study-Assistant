spring.application.name=study-assistant
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/study_assistant?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE_MB:20}MB
spring.servlet.multipart.max-request-size=${MAX_FILE_SIZE_MB:20}MB
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.openai-api-key=${OPENAI_API_KEY:}
app.openai-model=${OPENAI_MODEL:gpt-4o-mini}
